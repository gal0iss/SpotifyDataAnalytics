[pytest]
minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: test de integración del pipeline
    unit: test unitario
    slow: test lento
